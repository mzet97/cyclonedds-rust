[package]
name = "dds-wasm-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors.workspace = true
license.workspace = true
description = "Native reference gateway for the browser-DDS bridge (Phase C): TCP transport of proto v0 CDR frames <-> native DDS peer. Local test/reference only."
repository.workspace = true

[dependencies]
cyclonedds = { path = "../cyclonedds" }
cyclonedds-proto = { path = "../cyclonedds-proto", version = "0.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
cyclonedds-rust-sys = { workspace = true }
dds-wasm-guest = { path = "../dds-wasm-guest" }
criterion = { workspace = true }
libc = { workspace = true }

[[bench]]
name = "wasm_vs_native"
harness = false
