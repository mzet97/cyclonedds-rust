[package]
name = "cyclonedds-wasm"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Matheus Zeitune <matheus.zeitune.developer@gmail.com>"]
license = "MIT"
repository = "https://github.com/mzet97/cyclonedds-rust"
description = "Experimental DDS bindings for WebAssembly using WebSocket transport"
readme = "README.md"

# Backend separation (Phase B): this crate must NEVER depend on `cyclonedds`
# with the `native` backend (`cyclonedds-rust-sys` / libddsc cannot compile
# to wasm32 and must not leak into the web client dependency graph).
# Portable contracts come from `cyclonedds-proto` (no native deps).
[dependencies]
cyclonedds-proto = { path = "../cyclonedds-proto", version = "0.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Browser-only transport: linked ONLY for the wasm32 target so host builds
# and `cargo tree` audits stay free of browser shims.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "CloseEvent",
    "BinaryType",
    "Blob",
    "Window",
] }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"

# Host-only benches: criterion (rayon) cannot target wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "echo_codec"
harness = false

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
