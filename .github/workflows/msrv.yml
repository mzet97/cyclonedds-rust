name: MSRV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: msrv-1.85-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: Build with MSRV
        run: cargo build --workspace --features async --locked
      - name: Test with MSRV
        run: cargo test --workspace --features async --locked -- --test-threads=1 --skip cross_process_pub_sub_reliable --skip cross_process_pub_sub_best_effort
