# Phase H: blocking CI for the supported wasm profiles.
#
# Supported profiles: `browser-gateway` (host-testable) and the portable
# `proto` contracts. The `wasm-engine` profile is NOT supported (Phase G:
# blocked on wasi-sdk/wasmtime) and has no job here — a gap stays a gap.
#
# Blocking by construction: no `continue-on-error`, no `|| true`, no
# `|| :` anywhere in this file. Any red job fails the workflow.

name: WASM profiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Portable wire contracts: no native deps, runs everywhere.
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: wasm-proto-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: Test cyclonedds-proto
        run: cargo test -p cyclonedds-proto --locked

  # browser-gateway, host-testable half: pure codec, QoS treatment,
  # BigInt mapping, host NotConnected fallback, runnable example.
  browser-gateway-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: wasm-gateway-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: Test cyclonedds-wasm (host)
        run: cargo test -p cyclonedds-wasm --locked
      - name: Run host example
        run: cargo run -p cyclonedds-wasm --example echo_host --locked
      - name: Check JS example syntax
        run: node --check cyclonedds-wasm/js/example.mjs && node --check cyclonedds-wasm/js/index.mjs

  # browser-gateway under a real JS runtime: the wasm32 `WasmClient`
  # connects, echoes, converts BigInt, and rejects — executed in node
  # against the zero-dependency echo server (no browser needed).
  node-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust with wasm32 target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: wasm32-unknown-unknown
      - name: Install node
        uses: actions/setup-node@49933ea5288caeca8642d1f84dbe4159559c3e0d
        with:
          node-version: 24
      - name: Install matching wasm-bindgen-test-runner
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: wasm-node-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: Run wasm32 client tests under node
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          node cyclonedds-wasm/tests/support/ws_echo_server.mjs 18711 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 1
          cargo test -p cyclonedds-wasm --target wasm32-unknown-unknown --test wasm_node --locked

  # Native reference gateway + WASI guest: the bridge side of the profiles.
  bridge-and-guest:
    runs-on: ubuntu-latest
    env:
      CYCLONEDDS_URI: <CycloneDDS><Domain><General><NetworkInterfaceAddress>lo</NetworkInterfaceAddress></General></Domain></CycloneDDS>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: wasm-bridge-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: Test dds-wasm-bridge
        run: cargo test -p dds-wasm-bridge --locked -- --test-threads=1
      - name: Test dds-wasm-guest
        run: cargo test -p dds-wasm-guest --locked
      - name: Test dds-wasm-e2e gateway scenarios
        run: cargo test -p dds-wasm-e2e --locked -- --test-threads=1

  # wasm32 artifact: the exact code shipped to browsers must compile for
  # wasm32-unknown-unknown with zero warnings, and the dependency graph
  # must stay free of the native backend.
  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust with wasm32 target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: wasm-target-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: Check wasm32 without warnings
        run: cargo check -p cyclonedds-wasm -p dds-wasm-guest --target wasm32-unknown-unknown --locked
      - name: Deny warnings on wasm32
        run: RUSTFLAGS="-D warnings" cargo check -p cyclonedds-wasm --target wasm32-unknown-unknown --locked --offline
      - name: Native backend must not leak into wasm graphs
        run: |
          test -z "$(cargo tree -p cyclonedds-wasm --target wasm32-unknown-unknown --prefix none 2>/dev/null | grep 'cyclonedds-rust-sys ')"
          test -z "$(cargo tree -p dds-wasm-guest --target wasm32-unknown-unknown --prefix none 2>/dev/null | grep 'cyclonedds-rust-sys ')"
      - name: Release wasm artifact + size
        run: |
          cargo build -p cyclonedds-wasm --target wasm32-unknown-unknown --release --locked
          ls -la target/wasm32-unknown-unknown/release/cyclonedds_wasm.wasm

  # Benchmarks must at least compile and run (criterion smoke); numbers
  # are recorded in docs/wasm/BENCH_H.md, not gated on thresholds.
  bench-smoke:
    runs-on: ubuntu-latest
    env:
      CYCLONEDDS_URI: <CycloneDDS><Domain><General><NetworkInterfaceAddress>lo</NetworkInterfaceAddress></General></Domain></CycloneDDS>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: wasm-bench-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: Compile all benches
        run: cargo bench -p cyclonedds-wasm -p dds-wasm-bridge --no-run --locked
