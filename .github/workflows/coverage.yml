name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libssl-dev
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info -- --test-threads=1
      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: lcov.info
          fail_ci_if_error: true
