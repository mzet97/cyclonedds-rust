name: Security gates

on:
  push:
    branches: [main, "candidate/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, Clippy, tests, docs, no_std
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: quality-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked -- --test-threads=1
      - name: Doctests
        # The raw bindgen crate already declares `doctest = false`; forcing
        # `--doc` overrides that target policy and compiles C examples as Rust.
        # Every hand-written/public wrapper crate remains in this workspace gate.
        run: cargo test --doc --workspace --exclude cyclonedds-rust-sys --all-features --locked
      - name: no_std
        run: cargo check -p cyclonedds --no-default-features --features no_std --locked

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: msrv-1.85-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: Build and test on MSRV
        run: cargo +1.85.0 test --workspace --features async --locked -- --test-threads=1

  dependencies:
    name: cargo-audit and cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Audit RustSec advisories
        run: cargo audit
      - name: Enforce dependency policy
        run: cargo deny check

  unsafe-policy:
    name: Unsafe inventory and SAFETY policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate immutable workflows
        run: scripts/ci/check-security-workflows.sh
      - name: Validate unsafe inventory
        run: scripts/ci/check-unsafe-contracts.sh

  miri:
    name: Miri pure Rust (${{ matrix.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: miri-strict-provenance
            flags: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-backtrace=full -Zmiri-disable-isolation
          - model: miri-tree-borrows
            flags: -Zmiri-tree-borrows -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-backtrace=full -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          components: miri,rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.model }}-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: Miri pure-Rust crates
        env:
          MIRIFLAGS: ${{ matrix.flags }}
        run: cargo +nightly miri test -p cyclonedds-derive -p cyclonedds-build --locked

  asan:
    name: ASan Dynamic XTypes, FFI, loans, callbacks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang build-essential
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: asan-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
      - name: ASan public Dynamic XTypes and FFI boundaries
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p cyclonedds-test-suite --locked \
            --test dynamic_type_builder --test dynamic_cdr_roundtrip \
            --test dynamic_schema_publish --test loan_heap_fields \
            --test listener_panic_barrier -- --test-threads=1

  windows-abi:
    name: Windows ABI snapshot and CRLF regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Build the native probe
        run: cargo build -p cyclonedds-rust-sys --locked
      - name: Compare normalized x86_64-pc-windows-msvc snapshot
        shell: bash
        run: |
          probe="$(find target -name abi_probe.rs -path '*cyclonedds-rust-sys*' | head -1)"
          test -n "$probe"
          diff <(grep -v '^//' cyclonedds-rust-sys/abi/x86_64-pc-windows-msvc.rs | tr -d '\r') \
               <(tr -d '\r' < "$probe")
