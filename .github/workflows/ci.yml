  # This crate is a safe wrapper over a C library: the interesting failure mode
  # is memory corruption that a normal test run happily reports as "ok". The
  # regression suites below (raw CDR, loans over heap-backed types, string keys)
  # exist because exactly that shipped more than once. AddressSanitizer turns
  # silent corruption into a hard failure, and it needs nightly + a Linux target.
  #
  # Blocking as of the B+/B++ work. It was kept non-blocking on the argument that
  # the C library is not instrumented and its own leaks are out of our control;
  # `detect_leaks=0` already suppresses that class, and the signal turned out to
  # be clean: the last ten CI runs each report `success` for *this step* (not
  # just the job, which `continue-on-error` made report success either way), and
  # the most recent log has 17 tests passing across six binaries with no
  # `ERROR: AddressSanitizer` line. The only panics in it are the two
  # `listener_panic_barrier` tests asserting that a panic is contained.
  #
  # If instrumented-C noise does start appearing, narrow it with an ASAN
  # suppressions file rather than going back to ignoring the result.
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test under AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0"
        run: |
          cargo +nightly test -Z build-std --target x86_64-unknown-linux-gnu \
            -p cyclonedds-test-suite \
            --test cdr_roundtrip --test loan_heap_fields \
            --test instance_string_key --test listener_panic_barrier \
            --test async_reader_lifetime --test ops_scanner_alignment \
            --test nested_composite_seq --test native_layout_recursive \
            --test ops_vs_idlc \
            -- --test-threads=1
