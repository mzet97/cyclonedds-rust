# Detached from the root workspace, which is what cargo-fuzz expects: the fuzz
# crate depends on libfuzzer-sys and is built with its own sanitizer flags.
# Without this table the crate was neither a member nor excluded, so *any* cargo
# command in this directory failed with "current package believes it's in a
# workspace when it's not" — `cargo fuzz run` included. The target had never
# been runnable, not merely never run.
[workspace]

[package]
name = "cyclonedds-fuzz"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cyclonedds = { path = "../cyclonedds" }
cyclonedds-derive = { path = "../cyclonedds-derive" }

[[bin]]
name = "cdr_deserialize"
path = "fuzz_targets/cdr_deserialize.rs"
test = false
doc = false
